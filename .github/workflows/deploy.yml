name: Deploy backend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted  
    steps:
      - name: Pull and Restart Docker Containers
        run: |
          cd /home/pi/retrospective/retrospective-app-backend 
          
          git pull
          
          cd ..

          make up

          docker image prune -f
          
      - name: Deploy notify 
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          socks5: ${{secrets.SOCKS5_PROXY}}
          message: |
            Деплой.
            Статус деплоя: ${{ job.status == 'success' && '✅ Успешно' || '❌ Ошибка' }}
            Репозиторий: ${{ github.repository }}
            Ветка: ${{ github.ref_name }}
            Автор: ${{ github.actor }}
            Посмотреть: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
